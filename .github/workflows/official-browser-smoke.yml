name: Homologação visual web (fixtures)
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'tests/browser/**'
      - '.github/workflows/official-browser-smoke.yml'
permissions:
  contents: read
jobs:
  smoke:
    runs-on: ubuntu-24.04
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm install --no-save --package-lock=false --ignore-scripts @playwright/test@1.56.1
      - run: npx playwright install --with-deps chromium
      - run: npx playwright test tests/browser/official.spec.cjs --workers=1 --reporter=line
